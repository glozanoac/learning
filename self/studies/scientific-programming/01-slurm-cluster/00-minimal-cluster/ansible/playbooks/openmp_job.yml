---
# Compile and run the OpenMP pi job on one compute node as a regular user.
#
#   ansible-playbook playbooks/openmp_job.yml
#   ansible-playbook playbooks/openmp_job.yml -e omp_threads=8
#
# There is no shared filesystem yet, so the binary is built on every compute
# node in the same path, the job is submitted from the controller, and the
# output file is read back from the node that ran the job.

- name: Build the OpenMP program on the compute nodes
  hosts: slurm_compute
  roles:
    - slurm_defaults
  vars:
    job_user: "{{ slurm_cluster_users[0].name }}"
    job_dir: "/home/{{ job_user }}/openmp"
  become: true
  become_user: "{{ job_user }}"
  tasks:
    - name: Create job directory
      ansible.builtin.file:
        path: "{{ job_dir }}"
        state: directory
        mode: "0755"

    - name: Copy source
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../jobs/openmp/pi_omp.c"
        dest: "{{ job_dir }}/pi_omp.c"
        mode: "0644"
      register: source

    - name: Check for an existing binary
      ansible.builtin.stat:
        path: "{{ job_dir }}/pi_omp"
      register: binary

    - name: Compile with OpenMP
      ansible.builtin.command:
        cmd: gcc -O2 -fopenmp -o pi_omp pi_omp.c -lm
        chdir: "{{ job_dir }}"
      when: source.changed or not binary.stat.exists
      changed_when: true

- name: Submit the job from the controller and show the result
  hosts: "{{ groups['slurm_controller'][0] }}"
  gather_facts: false
  roles:
    - slurm_defaults
  vars:
    job_user: "{{ slurm_cluster_users[0].name }}"
    job_dir: "/home/{{ job_user }}/openmp"
    omp_threads: 4                 # requested; capped to the smallest node
  become: true
  become_user: "{{ job_user }}"
  tasks:
    - name: Create job directory
      ansible.builtin.file:
        path: "{{ job_dir }}"
        state: directory
        mode: "0755"

    - name: Copy batch script
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../jobs/openmp/pi_omp.sbatch"
        dest: "{{ job_dir }}/pi_omp.sbatch"
        mode: "0644"

    - name: Find CPUs on the smallest compute node
      ansible.builtin.command: sinfo -h -N -o %c
      register: node_cpus
      changed_when: false

    - name: Submit and wait for completion
      vars:
        cpus: "{{ [omp_threads | int, node_cpus.stdout_lines | map('int') | min] | min }}"
      ansible.builtin.command:
        cmd: sbatch --parsable --wait --cpus-per-task={{ cpus }} pi_omp.sbatch
        chdir: "{{ job_dir }}"
      register: job
      changed_when: true

    - name: Get job details
      ansible.builtin.command: scontrol show job -o {{ job.stdout | trim }}
      register: job_info
      changed_when: false

    - name: Record job id, state and the inventory host that ran it
      vars:
        node: "{{ job_info.stdout | regex_search(' NodeList=(\\S+)', '\\1') | first }}"
      ansible.builtin.set_fact:
        job_id: "{{ job.stdout | trim }}"
        job_state: "{{ job_info.stdout | regex_search('JobState=(\\S+)', '\\1') | first }}"
        job_exit: "{{ job_info.stdout | regex_search('ExitCode=(\\S+)', '\\1') | first }}"
        # (Slurm node name, inventory name) pairs -> inventory host of `node`
        job_host: >-
          {{ (groups['slurm_compute'] | map('extract', hostvars, 'ansible_hostname')
              | zip(groups['slurm_compute']) | selectattr('0', 'equalto', node) | first)[1] }}

- name: Show the job output (written on the compute node that ran it)
  hosts: "{{ hostvars[groups['slurm_controller'][0]].job_host }}"
  gather_facts: false
  roles:
    - slurm_defaults
  vars:
    ctl: "{{ hostvars[groups['slurm_controller'][0]] }}"
  tasks:
    - name: Read job output
      ansible.builtin.command: >-
        cat /home/{{ slurm_cluster_users[0].name }}/openmp/pi-omp-{{ ctl.job_id }}.out
      register: job_out
      changed_when: false

    - name: Job output
      ansible.builtin.debug:
        msg: "{{ job_out.stdout_lines + ['', 'State: ' ~ ctl.job_state ~ '  ExitCode: ' ~ ctl.job_exit] }}"
