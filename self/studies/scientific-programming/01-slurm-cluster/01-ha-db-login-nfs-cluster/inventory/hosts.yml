# Cluster inventory: which machine plays which role, and how to reach it.
#
# Host names must equal each machine's short hostname (`hostname -s`),
# because Slurm identifies nodes by hostname. Only the connection variables
# (ansible_host, ansible_port, ansible_user, key) depend on where the
# machines are. See README section 2 for the real-machine example.
#
# As shipped, this file points at the simulated machines from
# infrastructure/docker-compose.yml.
all:
  children:
    nfs_server:                 # shared /home and controller state
      hosts:
        nfs01:     { ansible_host: 127.0.0.1, ansible_port: 2221 }
    slurm_controller:           # first host = primary, the rest = backups
      hosts:
        slurmctl1: { ansible_host: 127.0.0.1, ansible_port: 2222 }
        slurmctl2: { ansible_host: 127.0.0.1, ansible_port: 2223 }
    slurm_dbd:                  # slurmdbd + MariaDB
      hosts:
        slurmdb:   { ansible_host: 127.0.0.1, ansible_port: 2224 }
    slurm_login:                # where users log in and submit jobs
      hosts:
        login:     { ansible_host: 127.0.0.1, ansible_port: 2225 }
    slurm_compute:              # slurmd
      hosts:
        c1:        { ansible_host: 127.0.0.1, ansible_port: 2226 }
        c2:        { ansible_host: 127.0.0.1, ansible_port: 2227 }

    # Every machine running Slurm components (MUNGE, slurm.conf, users)
    slurm_cluster:
      children:
        slurm_controller:
        slurm_dbd:
        slurm_login:
        slurm_compute:

  vars:
    ansible_user: root
    ansible_ssh_private_key_file: infrastructure/ssh/id_ed25519
    # the simulated machines get new SSH host keys whenever they are recreated
    ansible_ssh_common_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
