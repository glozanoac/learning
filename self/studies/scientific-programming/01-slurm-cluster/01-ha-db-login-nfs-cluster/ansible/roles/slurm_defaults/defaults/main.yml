---
# Cluster-wide defaults shared by every role (each role depends on this one).
# Override any of them in inventory/group_vars/all.yml.

# --- Identity -----------------------------------------------------------------
slurm_cluster_name: cluster

# SlurmUser must exist with the same UID/GID everywhere (64030 = Debian/Ubuntu default)
slurm_user: slurm
slurm_uid: 64030
slurm_gid: 64030

# Hosts by role (first controller = primary, the others = backups)
slurm_primary_controller: "{{ groups['slurm_controller'][0] }}"
slurm_dbd_host: "{{ groups['slurm_dbd'][0] }}"
slurm_login_host: "{{ groups['slurm_login'][0] }}"
nfs_server_host: "{{ groups['nfs_server'][0] }}"

# --- Container detection ------------------------------------------------------
# True when the machines are containers (e.g. the simulated infrastructure/).
# Containers share the host's kernel, clock and cgroups, so a few settings
# below adapt automatically.
slurm_nodes_are_containers: >-
  {{ groups['all']
     | map('extract', hostvars, 'ansible_virtualization_tech_guest')
     | map('default', []) | select('contains', 'container') | list | length > 0 }}

# --- Paths --------------------------------------------------------------------
slurm_conf_dir: /etc/slurm
slurm_log_dir: /var/log/slurm
slurm_state_save_location: /var/spool/slurmctld   # NFS-shared between controllers
slurm_slurmd_spool_dir: /var/spool/slurmd

# --- Shared storage (NFS) -----------------------------------------------------
nfs_export_root: /srv/nfs
nfs_mount_options: nfsvers=4.2,hard,noatime,_netdev
# What the NFS server exports and which host groups mount it where.
nfs_shares:
  - name: home
    export: "{{ nfs_export_root }}/home"
    mount: /home
    clients: [slurm_login, slurm_compute]
    owner: root
    group: root
    mode: "0755"
  - name: slurmctld
    export: "{{ nfs_export_root }}/slurmctld"
    mount: "{{ slurm_state_save_location }}"
    clients: [slurm_controller]
    owner: "{{ slurm_uid }}"
    group: "{{ slurm_gid }}"
    mode: "0700"

# --- Plugins (cgroup-based on machines, cgroup-free in containers) ------------
slurm_proctrack_type: "{{ 'proctrack/linuxproc' if slurm_nodes_are_containers | bool else 'proctrack/cgroup' }}"
slurm_task_plugin: "{{ 'task/affinity' if slurm_nodes_are_containers | bool else 'task/cgroup,task/affinity' }}"
slurm_jobacct_gather_type: "{{ 'jobacct_gather/linux' if slurm_nodes_are_containers | bool else 'jobacct_gather/cgroup' }}"
slurm_select_type: select/cons_tres
slurm_select_type_parameters: CR_Core_Memory
slurm_mpi_default: pmi2
# config_overrides: trust slurm.conf over detected hardware (containers see all host CPUs)
slurm_slurmd_parameters: "{{ 'config_overrides' if slurm_nodes_are_containers | bool else '' }}"

# --- High availability --------------------------------------------------------
# Seconds the backup controller waits for the primary before taking over.
slurm_slurmctld_timeout: 60

# --- Nodes & partitions -------------------------------------------------------
# Node hardware is detected with `slurmd -C`. Optional caps (0 = no cap);
# containers are capped because each one sees the whole host.
slurm_node_max_cpus: "{{ 4 if slurm_nodes_are_containers | bool else 0 }}"
slurm_node_max_memory_mb: "{{ 2048 if slurm_nodes_are_containers | bool else 0 }}"
slurm_node_mem_reserve_mb: 512         # left to the OS, subtracted from RealMemory
slurm_def_mem_per_cpu: 256

slurm_partitions:
  - name: debug
    nodes: ALL
    default: true
    max_time: "01:00:00"

# Packages on compute nodes so jobs can run there
slurm_compute_packages: [gcc, make, libgomp1]
# Packages on the login node so users can build jobs
slurm_login_packages: [build-essential, gfortran, make]

# --- Accounting (slurmdbd) ----------------------------------------------------
slurm_accounting_enforce: associations,limits,qos
slurmdbd_storage_db: slurm_acct_db
slurmdbd_storage_user: slurm
# Generated once on the machine running Ansible and kept next to the
# inventory (like the MUNGE key). Set it explicitly (ideally with
# ansible-vault) if you prefer.
slurmdbd_storage_pass: >-
  {{ lookup('ansible.builtin.password',
            inventory_dir ~ '/.secrets/slurmdbd_password length=32 chars=ascii_letters,digits') }}
slurmdbd_innodb_buffer_pool_size: "{{ '256M' if slurm_nodes_are_containers | bool else '1024M' }}"

# Accounts in the accounting database
slurm_accounts:
  - name: research
    description: Research group
    organization: hpc

# --- Cluster users ------------------------------------------------------------
# Regular accounts that submit jobs: same UID on every node, home on NFS,
# association with an account in the accounting database.
slurm_cluster_users:
  - name: hpcuser
    uid: 2001
    account: research

# --- OS integration (the container host already handles these) ---------------
common_install_time_sync: "{{ not slurm_nodes_are_containers | bool }}"
common_manage_etc_hosts: "{{ not slurm_nodes_are_containers | bool }}"

# --- MUNGE --------------------------------------------------------------------
# One key for the whole cluster, generated once on the machine running Ansible.
munge_key_local_path: "{{ inventory_dir }}/.secrets/munge.key"
