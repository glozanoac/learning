---
# NFS server for the cluster's shared storage (nfs_shares):
#   home      -> /home on the login and compute nodes
#   slurmctld -> StateSaveLocation on every controller (needed for HA)
# Exports use root_squash, so every directory is created and owned here,
# on the server, by numeric UID/GID.

- name: Install NFS server
  ansible.builtin.apt:
    name: nfs-kernel-server
    state: present

- name: Create exported directories
  ansible.builtin.file:
    path: "{{ item.export }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop: "{{ nfs_shares }}"
  loop_control:
    label: "{{ item.export }}"

- name: Create user home directories on the share
  ansible.builtin.copy:
    src: /etc/skel/
    dest: "{{ nfs_export_root }}/home/{{ item.name }}/"
    remote_src: true
    owner: "{{ item.uid }}"
    group: "{{ item.gid | default(item.uid) }}"
    mode: preserve
  loop: "{{ slurm_cluster_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Set home directory permissions
  ansible.builtin.file:
    path: "{{ nfs_export_root }}/home/{{ item.name }}"
    state: directory
    owner: "{{ item.uid }}"
    group: "{{ item.gid | default(item.uid) }}"
    mode: "0750"
  loop: "{{ slurm_cluster_users }}"
  loop_control:
    label: "{{ item.name }}"

# Ansible's working directory for tasks run as these users (become_user)
- name: Create Ansible temp directory in each home
  ansible.builtin.file:
    path: "{{ nfs_export_root }}/home/{{ item.0.name }}/{{ item.1 }}"
    state: directory
    owner: "{{ item.0.uid }}"
    group: "{{ item.0.gid | default(item.0.uid) }}"
    mode: "0700"
  loop: "{{ slurm_cluster_users | product(['.ansible', '.ansible/tmp']) | list }}"
  loop_control:
    label: "{{ item.0.name }}/{{ item.1 }}"

- name: Write /etc/exports (each share only to the hosts that mount it)
  ansible.builtin.template:
    src: exports.j2
    dest: /etc/exports
    mode: "0644"
  register: exports

- name: Start and enable the NFS server
  ansible.builtin.systemd_service:
    name: nfs-server
    state: started
    enabled: true

- name: Apply export changes
  ansible.builtin.command: exportfs -ra
  when: exports.changed
  changed_when: true

- name: Show active exports
  ansible.builtin.command: exportfs -v
  register: exportfs_v
  changed_when: false

- name: Active exports
  ansible.builtin.debug:
    var: exportfs_v.stdout_lines
