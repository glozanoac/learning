# Cluster inventory: which machine plays which role, and how to reach it.
#
# Host names must equal each machine's short hostname (`hostname -s`),
# because Slurm identifies nodes by hostname. The connection variables
# (ansible_host, ansible_port, ansible_user, key) are the only thing that
# changes between machines; the playbooks treat every node the same way.
#
# As shipped, this file points at the simulated machines started from
# infrastructure/docker-compose.yml. For other machines, replace the host
# entries (see the example at the bottom).
all:
  children:
    slurm_controller:
      hosts:
        slurmctl:
          ansible_host: 127.0.0.1
          ansible_port: 2221
    slurm_compute:
      hosts:
        c1:
          ansible_host: 127.0.0.1
          ansible_port: 2222
    slurm_cluster:
      children:
        slurm_controller:
        slurm_compute:
      vars:
        ansible_user: root
        ansible_ssh_private_key_file: infrastructure/ssh/id_ed25519
        # These machines get new SSH host keys whenever they are recreated
        ansible_ssh_common_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null

# Example with machines on your network:
#
# all:
#   children:
#     slurm_controller:
#       hosts:
#         hpc-ctl01:
#           ansible_host: 192.168.1.10
#     slurm_compute:
#       hosts:
#         hpc-c01:
#           ansible_host: 192.168.1.21
#     slurm_cluster:
#       children:
#         slurm_controller:
#         slurm_compute:
#       vars:
#         ansible_user: admin          # account with sudo on every node
#         ansible_become: true
