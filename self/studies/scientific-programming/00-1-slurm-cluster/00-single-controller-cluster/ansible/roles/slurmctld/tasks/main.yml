---
- name: Install slurmctld
  ansible.builtin.apt:
    name: slurmctld
    state: present

- name: Create StateSaveLocation (local disk, owned by SlurmUser)
  ansible.builtin.file:
    path: "{{ slurm_state_save_location }}"
    state: directory
    owner: "{{ slurm_user }}"
    group: "{{ slurm_user }}"
    mode: "0700"

- name: Start and enable slurmctld
  ansible.builtin.systemd_service:
    name: slurmctld
    state: started
    enabled: true
  register: slurmctld_started

- name: Restart slurmctld after a configuration change
  ansible.builtin.systemd_service:
    name: slurmctld
    state: restarted
  when:
    - slurm_config_changed | default(false) | bool
    - not slurmctld_started.changed

- name: Wait for slurmctld to answer
  ansible.builtin.command: scontrol ping
  register: ping
  until: "'UP' in ping.stdout"
  retries: 20
  delay: 3
  changed_when: false
